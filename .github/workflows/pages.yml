name: Deploy NoAir preview to GitHub Pages

# Publishes only the safe static demo from /static.
on:
  push:
    branches: ["main"]
    paths:
      - "static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build safe static preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/static
          cp -R static/. dist/static/
          cp static/index.html dist/index.html
          sed -i 's/data-demo="false"/data-demo="true"/' dist/index.html
          sed -i 's|href="/static/|href="./static/|g; s|src="/static/|src="./static/|g' dist/index.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
